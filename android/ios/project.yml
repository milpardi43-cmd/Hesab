name: Hesabyar
options:
  bundleIdPrefix: ir.hesabyar
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hesabyar:
    type: application
    platform: iOS
    sources:
      - path: Hesabyar
        excludes:
          - "Resources/Fonts/**"
      - path: Hesabyar/Resources/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ir.hesabyar.app
        PRODUCT_NAME: Hesabyar
        INFOPLIST_KEY_CFBundleDisplayName: حسابیار
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: Hesabyar/Info.plist
      properties:
        CFBundleDisplayName: حسابیار
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-SemiBold.ttf
          - Vazirmatn-Bold.ttf
          - Vazirmatn-ExtraBold.ttf
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
schemes:
  Hesabyar:
    build:
      targets:
        Hesabyar: all
    run:
      config: Debug
    archive:
      config: Release
